<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Token Manager - 访问验证</title>
    <script src="vendor/tailwind.js"></script>
    <link href="vendor/daisyui.full.min.css" rel="stylesheet" type="text/css" />
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#a855f7',
                        secondary: '#6366f1',
                        accent: '#f472b6',
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }

        /* Dark Theme (Default) */
        [data-theme="dark"] {
            --bg-primary: #0f0f1a;
            --bg-secondary: #1a1a2e;
            --bg-tertiary: #252542;
            --bg-card: #1a1a2e;
            --glass-bg: rgba(26, 26, 46, 0.8);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: #e5e7eb;
            --text-muted: #9ca3af;
            --gradient-start: #a855f7;
            --gradient-end: #6366f1;
            --hover-shadow: rgba(168, 85, 247, 0.15);
            --card-border: #374151;
        }

        /* Light Theme */
        [data-theme="light"] {
            --bg-primary: #f8fafc;
            --bg-secondary: #f1f5f9;
            --bg-tertiary: #e2e8f0;
            --bg-card: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.9);
            --glass-border: rgba(0, 0, 0, 0.1);
            --text-primary: #0f172a;
            --text-secondary: #334155;
            --text-muted: #64748b;
            --gradient-start: #a855f7;
            --gradient-end: #6366f1;
            --hover-shadow: rgba(168, 85, 247, 0.2);
            --card-border: #e2e8f0;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .glass-effect {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
        }

        .gradient-border {
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            padding: 2px;
            border-radius: 1rem;
        }

        .inner-card {
            background: var(--bg-card);
            border-radius: calc(1rem - 2px);
            border: 1px solid var(--card-border);
        }

        .input-bordered {
            background-color: var(--bg-tertiary) !important;
            border-color: var(--card-border) !important;
            color: var(--text-primary) !important;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .input-bordered:focus {
            border-color: var(--gradient-start) !important;
        }

        .input::placeholder {
            color: var(--text-muted) !important;
        }

        .mode-tab {
            transition: all 0.2s ease;
        }
        .mode-tab.active {
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            color: #fff;
        }
        .mode-tab:not(.active) {
            opacity: 0.6;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center px-6">
    <!-- 语言/主题切换 -->
    <div class="fixed top-4 right-4 z-10 flex gap-2">
    <button id="lang-btn" onclick="toggleLang()" class="btn btn-ghost btn-sm font-semibold">EN</button>
    <button onclick="toggleTheme()" class="btn btn-ghost btn-circle">
        <svg id="theme-icon-dark" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
        </svg>
        <svg id="theme-icon-light" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
        </svg>
    </button>
    </div>

    <!-- 登录卡片 -->
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <div class="w-20 h-20 mx-auto rounded-2xl bg-gradient-to-br from-primary to-secondary flex items-center justify-center mb-4">
                <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                </svg>
            </div>
            <h1 class="text-3xl font-bold bg-gradient-to-r from-primary to-secondary bg-clip-text text-transparent">Token Manager</h1>
            <p id="subtitle" class="mt-2 text-sm opacity-60">AI API 余额查询工具 · 请输入访问码继续</p>
        </div>

        <div class="gradient-border">
            <div class="inner-card p-8">
                <!-- 多用户模式：登录/注册切换标签 -->
                <div id="multi-tabs" class="hidden flex mb-6 rounded-lg p-1" style="background: var(--bg-tertiary);">
                    <button id="tab-login" type="button" onclick="switchTab('login')" class="mode-tab active flex-1 py-2 text-sm font-semibold rounded-md">登录</button>
                    <button id="tab-register" type="button" onclick="switchTab('register')" class="mode-tab flex-1 py-2 text-sm font-semibold rounded-md">注册</button>
                </div>

                <!-- 访问码模式 -->
                <form id="code-form" onsubmit="return doCodeLogin(event)">
                    <label class="label pb-1">
                        <span class="text-sm opacity-70">访问码</span>
                    </label>
                    <input id="access-code" type="password" class="input input-bordered input-bordered w-full" placeholder="请输入访问码" autocomplete="current-password" autofocus />
                    <button id="login-btn" type="submit" class="btn btn-primary w-full mt-6">
                        进入
                    </button>
                </form>

                <!-- 多用户模式：登录 -->
                <form id="multi-login-form" class="hidden" onsubmit="return doUserLogin(event)">
                    <label class="label pb-1">
                        <span class="text-sm opacity-70">用户名</span>
                    </label>
                    <input id="login-username" type="text" class="input input-bordered w-full" placeholder="请输入用户名" autocomplete="username" />
                    <label class="label pb-1 pt-4">
                        <span class="text-sm opacity-70">密码</span>
                    </label>
                    <input id="login-password" type="password" class="input input-bordered w-full" placeholder="请输入密码" autocomplete="current-password" />
                    <button id="user-login-btn" type="submit" class="btn btn-primary w-full mt-6">
                        登录
                    </button>
                </form>

                <!-- 多用户模式：注册 -->
                <form id="multi-register-form" class="hidden" onsubmit="return doRegister(event)">
                    <label class="label pb-1">
                        <span class="text-sm opacity-70">用户名</span>
                    </label>
                    <input id="reg-username" type="text" class="input input-bordered w-full" placeholder="2-32位字母、数字、下划线或连字符" autocomplete="username" />
                    <label class="label pb-1 pt-4">
                        <span class="text-sm opacity-70">密码</span>
                    </label>
                    <input id="reg-password" type="password" class="input input-bordered w-full" placeholder="至少6位" autocomplete="new-password" />
                    <label class="label pb-1 pt-4">
                        <span class="text-sm opacity-70">确认密码</span>
                    </label>
                    <input id="reg-password2" type="password" class="input input-bordered w-full" placeholder="请再次输入密码" autocomplete="new-password" />
                    <div id="invite-row" class="hidden">
                        <label class="label pb-1 pt-4">
                            <span class="text-sm opacity-70">邀请码</span>
                        </label>
                        <input id="reg-invite" type="password" class="input input-bordered w-full" placeholder="请输入邀请码" autocomplete="off" />
                    </div>
                    <button id="register-btn" type="submit" class="btn btn-primary w-full mt-6">
                        注册
                    </button>
                </form>

                <div id="login-error" class="hidden mt-3 text-sm text-error flex items-center gap-2">
                    <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                    </svg>
                    <span id="login-error-text">访问码错误，请重试</span>
                </div>
            </div>
        </div>

        <p class="text-center text-xs opacity-40 mt-6"><span id="footer-hint">访问码由部署者在 docker-compose.yml 中设置</span> · v1.4</p>
    </div>

    <script>

        // ===== 中英文双语（默认中文） =====
        let lang = localStorage.getItem('lang') || 'zh';
        const I18N_EN = {"AI API 余额查询工具 · 请输入访问码继续": "AI API Balance Query · Enter access code to continue", "AI API 余额查询工具 · 登录以继续": "AI API Balance Query · Sign in to continue", "访问码": "Access Code", "进入": "Sign In", "登录": "Sign In", "注册": "Register", "用户名": "Username", "密码": "Password", "确认密码": "Confirm Password", "邀请码": "Invite Code", "请输入访问码": "Enter access code", "请输入访问码 ": "Enter access code", "请输入用户名": "Enter username", "请输入密码": "Enter password", "请再次输入密码": "Enter password again", "请输入邀请码": "Enter invite code", "2-32位字母、数字、下划线或连字符": "2-32 chars: letters, digits, underscore or hyphen", "至少6位": "At least 6 characters", "访问码错误，请重试": "Invalid access code, please try again", "用户名或密码错误": "Incorrect username or password", "邀请码错误": "Invalid invite code", "该用户名已被注册": "This username is already taken", "用户名需为2-32位字母、数字、下划线或连字符": "Username must be 2-32 chars: letters, digits, underscore or hyphen", "密码至少需要6位": "Password must be at least 6 characters", "两次输入的密码不一致": "Passwords do not match", "尝试过于频繁，请15分钟后再试": "Too many attempts, please try again in 15 minutes", "网络错误，请稍后重试": "Network error, please try again later", "访问码由部署者在 docker-compose.yml 中设置": "The access code is configured by the deployer in docker-compose.yml", "邀请码由部署者在 docker-compose.yml 中设置": "The invite code is configured by the deployer in docker-compose.yml", "Token Manager - 访问验证": "Token Manager - Access Verification"};
        function t(s) { return lang === 'en' ? (I18N_EN[s] || s) : s; }
        let _i18nNodes = null;
        function _collectI18n() {
            _i18nNodes = [];
            const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, {
                acceptNode: n => n.textContent.trim() ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT
            });
            while (walker.nextNode()) {
                const node = walker.currentNode;
                const tag = node.parentElement && node.parentElement.tagName;
                if (tag === 'SCRIPT' || tag === 'STYLE') continue;
                const s = node.textContent.trim();
                if (I18N_EN[s]) _i18nNodes.push({ node: node, zh: node.textContent, key: s });
                const ph = node.parentElement && node.parentElement.tagName === 'INPUT' ? node.parentElement.getAttribute('placeholder') : null;
                if (ph && I18N_EN[ph]) _i18nNodes.push({ ph: node.parentElement, zh: ph });
            }
        }
        function applyLang() {
            if (!_i18nNodes) _collectI18n();
            _i18nNodes.forEach(item => {
                if (item.ph) { item.ph.setAttribute('placeholder', t(item.zh)); }
                else { item.node.textContent = item.zh.replace(item.key, t(item.key)); }
            });
            document.documentElement.lang = lang === 'en' ? 'en' : 'zh-CN';
            const btn = document.getElementById('lang-btn');
            if (btn) btn.textContent = lang === 'en' ? '中文' : 'EN';
            updateModeTexts();
        }
        function toggleLang() {
            lang = lang === 'zh' ? 'en' : 'zh';
            localStorage.setItem('lang', lang);
            applyLang();
        }

        // ===== 模式切换（访问码 / 多用户） =====
        let authMode = 'code';
        let inviteRequired = false;
        let currentTab = 'login';

        // 按当前模式刷新动态文案（在applyLang末尾调用，保证切换语言后仍正确）
        function updateModeTexts() {
            const subtitle = document.getElementById('subtitle');
            const footer = document.getElementById('footer-hint');
            if (authMode === 'multi') {
                subtitle.textContent = t('AI API 余额查询工具 · 登录以继续');
                footer.textContent = t('邀请码由部署者在 docker-compose.yml 中设置');
            } else {
                subtitle.textContent = t('AI API 余额查询工具 · 请输入访问码继续');
                footer.textContent = t('访问码由部署者在 docker-compose.yml 中设置');
            }
        }

        async function initMode() {
            try {
                const response = await fetch('/api/auth/check');
                const data = await response.json();
                authMode = data.mode || (data.enabled ? 'code' : 'none');
                inviteRequired = !!data.invite_required;
            } catch (e) {
                authMode = 'code';
            }
            if (authMode === 'multi') {
                document.getElementById('code-form').classList.add('hidden');
                document.getElementById('multi-tabs').classList.remove('hidden');
                if (inviteRequired) document.getElementById('invite-row').classList.remove('hidden');
                switchTab('login');
                document.getElementById('login-username').focus();
            } else {
                document.getElementById('access-code').focus();
            }
            updateModeTexts();
        }

        function switchTab(tab) {
            currentTab = tab;
            const isLogin = tab === 'login';
            document.getElementById('multi-login-form').classList.toggle('hidden', !isLogin);
            document.getElementById('multi-register-form').classList.toggle('hidden', isLogin);
            document.getElementById('tab-login').classList.toggle('active', isLogin);
            document.getElementById('tab-register').classList.toggle('active', !isLogin);
            hideError();
            const input = document.getElementById(isLogin ? 'login-username' : 'reg-username');
            if (input) input.focus();
        }

        function showError(msg) {
            document.getElementById('login-error-text').textContent = msg;
            document.getElementById('login-error').classList.remove('hidden');
        }
        function hideError() {
            document.getElementById('login-error').classList.add('hidden');
        }

        function setBtnLoading(id, loading) {
            const btn = document.getElementById(id);
            btn.disabled = loading;
            btn.classList.toggle('loading', loading);
        }

        async function postJSON(url, body) {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            let data = {};
            try { data = await response.json(); } catch (e) {}
            return { ok: response.ok, data: data };
        }

        // ===== 主题切换（与主界面一致，共用同一个 localStorage 主题配置） =====
        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.getAttribute('data-theme') === 'dark';
            html.setAttribute('data-theme', isDark ? 'light' : 'dark');

            document.getElementById('theme-icon-dark').classList.toggle('hidden', !isDark);
            document.getElementById('theme-icon-light').classList.toggle('hidden', isDark);

            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        }

        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            document.getElementById('theme-icon-dark').classList.toggle('hidden', savedTheme !== 'dark');
            document.getElementById('theme-icon-light').classList.toggle('hidden', savedTheme === 'dark');
            applyLang();
            initMode();
        });

        // ===== 访问码登录 =====
        async function doCodeLogin(event) {
            event.preventDefault();
            const code = document.getElementById('access-code').value.trim();

            if (!code) {
                showError(t('请输入访问码'));
                return false;
            }

            setBtnLoading('login-btn', true);
            hideError();

            try {
                const { ok, data } = await postJSON('/api/auth/login', { code: code });
                if (ok && data.success) {
                    location.href = '/';
                    return false;
                }
                showError(t(data.error || '访问码错误，请重试'));
            } catch (e) {
                showError(t('网络错误，请稍后重试'));
            }

            setBtnLoading('login-btn', false);
            return false;
        }

        // ===== 多用户：登录 =====
        async function doUserLogin(event) {
            event.preventDefault();
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value;

            if (!username || !password) {
                showError(t('请输入用户名') + ' / ' + t('请输入密码'));
                return false;
            }

            setBtnLoading('user-login-btn', true);
            hideError();

            try {
                const { ok, data } = await postJSON('/api/auth/login', { username: username, password: password });
                if (ok && data.success) {
                    location.href = '/';
                    return false;
                }
                showError(t(data.error || '用户名或密码错误'));
            } catch (e) {
                showError(t('网络错误，请稍后重试'));
            }

            setBtnLoading('user-login-btn', false);
            return false;
        }

        // ===== 多用户：注册（成功后自动登录） =====
        async function doRegister(event) {
            event.preventDefault();
            const username = document.getElementById('reg-username').value.trim();
            const password = document.getElementById('reg-password').value;
            const password2 = document.getElementById('reg-password2').value;
            const invite = document.getElementById('reg-invite').value.trim();

            if (!username || !password) {
                showError(t('请输入用户名') + ' / ' + t('请输入密码'));
                return false;
            }
            if (password !== password2) {
                showError(t('两次输入的密码不一致'));
                return false;
            }
            if (inviteRequired && !invite) {
                showError(t('请输入邀请码'));
                return false;
            }

            setBtnLoading('register-btn', true);
            hideError();

            try {
                const { ok, data } = await postJSON('/api/auth/register', {
                    username: username, password: password, invite_code: invite
                });
                if (ok && data.success) {
                    location.href = '/';
                    return false;
                }
                showError(t(data.error || '注册失败，请重试'));
            } catch (e) {
                showError(t('网络错误，请稍后重试'));
            }

            setBtnLoading('register-btn', false);
            return false;
        }
    </script>
</body>
</html>
